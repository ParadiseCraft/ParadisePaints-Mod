name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged sources
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Java 25
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.3.0
      - name: Verify tag matches mod version
        shell: bash
        run: |
          version="$(sed -n 's/^mod_version=//p' gradle.properties)"
          test "$GITHUB_REF_NAME" = "v$version"
      - name: Build and test every supported Minecraft version
        run: ./gradlew clean build --no-daemon
      - name: Create SHA-256 manifest
        working-directory: build/distributions
        run: LC_ALL=C sha256sum *.jar | sort -k2 > SHA256SUMS
      - name: Attest release JAR provenance
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: build/distributions/*.jar
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          build/distributions/*.jar
          build/distributions/SHA256SUMS
          --verify-tag
          --generate-notes
          --title "ParadisePaints ${GITHUB_REF_NAME#v}"
