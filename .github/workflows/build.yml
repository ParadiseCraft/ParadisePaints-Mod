name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out sources
        uses: actions/checkout@v7.0.1
      - name: Set up Java 25
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.3.0
      - name: Build and test every supported Minecraft version
        run: ./gradlew clean build --no-daemon
      - name: Create SHA-256 manifest
        working-directory: build/distributions
        run: LC_ALL=C sha256sum *.jar | sort -k2 > SHA256SUMS
      - name: Upload distributable JARs
        uses: actions/upload-artifact@v7.0.1
        with:
          name: paradisepaints-${{ github.sha }}
          path: |
            build/distributions/*.jar
            build/distributions/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
